<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>End-to-end lifecycle swim lanes with AI-authored WBS booking and SAP-to-scheduler WBS publish</title>
